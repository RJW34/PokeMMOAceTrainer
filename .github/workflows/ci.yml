name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,overlay]
      - run: python -m huntlab.guards.no_live_control .
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=huntlab --cov-report=term-missing
