[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-hunt-agent-lab"
version = "0.1.0"
description = "Replay- and simulator-first Pokémon hunting agent research scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "ruff>=0.5",
]
overlay = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]
vision = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "Pillow>=10.0",
]

[project.scripts]
huntlab = "huntlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["huntlab"]
